name: Dependabot Auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    
    steps:
      - name: Get Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: 'build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          
      - name: Auto-merge patch and minor updates
        if: |
          steps.dependabot-metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.dependabot-metadata.outputs.update-type == 'version-update:semver-minor' && 
           contains(steps.dependabot-metadata.outputs.dependency-names, 'org.junit') ||
           contains(steps.dependabot-metadata.outputs.dependency-names, 'org.mockito') ||
           contains(steps.dependabot-metadata.outputs.dependency-names, 'org.jacoco') ||
           contains(steps.dependabot-metadata.outputs.dependency-names, 'com.diffplug.spotless'))
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Add comment for major updates
        if: steps.dependabot-metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "🚨 **Major version update detected!** 
          
          This requires manual review before merging:
          - Check for breaking changes in changelog
          - Run integration tests locally
          - Update any deprecated APIs if needed
          
          Dependencies: ${{ steps.dependabot-metadata.outputs.dependency-names }}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
